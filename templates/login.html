<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | FindBack</title>
</head>

<body style="font-family:Arial;background:#f4f7fb;padding:40px;">

    <div style="max-width:420px;margin:auto;background:white;padding:30px;border-radius:12px;">

        <h1>Welcome Back</h1>
        <p>Login to your FindBack account.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Login</button>
        </form>

        <p>
            New user?
            <a href="{% url 'register' %}">Create account</a>
        </p>

        <a href="/">Back to Home</a>

    </div>

</body>

</html>
