<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Register | FindBack</title>
</head>

<body style="font-family:Arial;background:#f4f7fb;padding:40px;">

    <div style="max-width:420px;margin:auto;background:white;padding:30px;border-radius:12px;">

        <h1>Create Account</h1>
        <p>Join FindBack to report and recover lost items.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Register</button>
        </form>

        <p>
            Already registered?
            <a href="{% url 'login' %}">Login</a>
        </p>

        <a href="/">Back to Home</a>

    </div>

</body>

</html>
